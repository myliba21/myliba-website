services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-myliba_wp}
      MARIADB_USER: ${WORDPRESS_DB_USER:-myliba_wp}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-myliba_wp_pass}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-myliba_wp_root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-myliba_wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-myliba_wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-myliba_wp_pass}
      WPMS_MAIL_FROM: ${WPMS_MAIL_FROM:-hello@myliba.com}
      WPMS_MAIL_FROM_NAME: ${WPMS_MAIL_FROM_NAME:-Myliba}
      WPMS_MAILER: ${WPMS_MAILER:-smtp}
      WPMS_GMAIL_CLIENT_ID: ${WPMS_GMAIL_CLIENT_ID:-}
      WPMS_GMAIL_CLIENT_SECRET: ${WPMS_GMAIL_CLIENT_SECRET:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        if (!defined('WP_DEBUG')) {
          define('WP_DEBUG', true);
        }
        if (!defined('WP_DEBUG_LOG')) {
          define('WP_DEBUG_LOG', true);
        }
        if (!defined('DISALLOW_FILE_EDIT')) {
          define('DISALLOW_FILE_EDIT', true);
        }
        if (!defined('AUTOMATIC_UPDATER_DISABLED')) {
          define('AUTOMATIC_UPDATER_DISABLED', false);
        }
        // WP Mail SMTP configuration
        define('WPMS_ON', true);
        define('WPMS_MAIL_FROM', getenv('WPMS_MAIL_FROM') ?: 'hello@myliba.com');
        define('WPMS_MAIL_FROM_NAME', getenv('WPMS_MAIL_FROM_NAME') ?: 'Myliba');
        define('WPMS_MAIL_FROM_FORCE', true);
        // Local: 'smtp' (Mailpit) — Production: 'gmail' (Google OAuth)
        define('WPMS_MAILER', getenv('WPMS_MAILER') ?: 'smtp');
        define('WPMS_SMTP_HOST', 'mailpit');
        define('WPMS_SMTP_PORT', 1025);
        define('WPMS_SSL', '');
        define('WPMS_SMTP_AUTH', false);
        define('WPMS_SMTP_AUTOTLS', false);
        define('WPMS_GMAIL_CLIENT_ID', getenv('WPMS_GMAIL_CLIENT_ID') ?: '');
        define('WPMS_GMAIL_CLIENT_SECRET', getenv('WPMS_GMAIL_CLIENT_SECRET') ?: '');
        // PRODUCTION NOTE: Set the following before going live:
        //   define('WP_ENVIRONMENT_TYPE', 'production');
        //   define('WP_DEBUG', false);
        //   define('WP_DEBUG_LOG', false);
        //   define('WP_DEBUG_DISPLAY', false);
        //   define('DISALLOW_FILE_MODS', true); // Prevents plugin/theme upload via admin
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    restart: unless-stopped

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-myliba_wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-myliba_wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-myliba_wp_pass}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    working_dir: /var/www/html
    profiles: ["tools"]

volumes:
  db_data:
  wordpress_data:

